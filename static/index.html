<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where in the World — Geocoder Demo</title>
<script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

#map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }

.search-container {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 10; width: 440px; max-width: calc(100vw - 32px);
}

#search-input {
  width: 100%; padding: 12px 16px; font-size: 15px; border: none;
  border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  outline: none; background: #fff; color: #222;
}
#search-input::placeholder { color: #999; }

#results {
  display: none; margin-top: 4px; background: #fff; border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.16); overflow: hidden;
  max-height: 380px; overflow-y: auto;
}

#results.visible { display: block; }

.result-item {
  padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #eee;
  display: flex; align-items: center; gap: 10px;
}
.result-item:last-child { border-bottom: none; }
.result-item:hover, .result-item.active { background: #f0f4ff; }

.result-icon {
  width: 28px; height: 28px; border-radius: 50%; background: #4a6cf7;
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; flex-shrink: 0;
}

.result-text { flex: 1; min-width: 0; }
.result-name { font-size: 14px; font-weight: 500; color: #222; }
.result-detail { font-size: 12px; color: #777; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.marker { width: 28px; height: 28px; }
</style>
</head>
<body>

<div id="map"></div>

<div class="search-container">
  <input type="text" id="search-input" placeholder="Search for a place…" autocomplete="off" autofocus>
  <div id="results"></div>
</div>

<script>
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a>"
      }
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }]
  },
  center: [0, 20],
  zoom: 2
});

const nav = new maplibregl.NavigationControl();
map.addControl(nav, "top-right");

let marker = null;
let activeIndex = -1;
let debounceTimer = null;

const searchInput = document.getElementById("search-input");
const resultsDiv = document.getElementById("results");

searchInput.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { hideResults(); return; }
  debounceTimer = setTimeout(() => autocomplete(q), 200);
});

searchInput.addEventListener("keydown", (e) => {
  const items = resultsDiv.querySelectorAll(".result-item");
  if (e.key === "ArrowDown") {
    e.preventDefault();
    activeIndex = Math.min(activeIndex + 1, items.length - 1);
    updateActive(items);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    activeIndex = Math.max(activeIndex - 1, 0);
    updateActive(items);
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (activeIndex >= 0 && items[activeIndex]) {
      items[activeIndex].click();
    }
  } else if (e.key === "Escape") {
    hideResults();
  }
});

searchInput.addEventListener("blur", () => {
  setTimeout(hideResults, 150);
});

function updateActive(items) {
  items.forEach((item, i) => item.classList.toggle("active", i === activeIndex));
  if (activeIndex >= 0 && items[activeIndex]) {
    items[activeIndex].scrollIntoView({ block: "nearest" });
  }
}

async function autocomplete(q) {
  try {
    const center = map.getCenter();
    let url = `/v1/autocomplete?q=${encodeURIComponent(q)}&limit=8`;
    if (center && center.lat !== undefined && center.lng !== undefined) {
      url += `&lat=${center.lat.toFixed(4)}&lng=${center.lng.toFixed(4)}`;
    }
    const resp = await fetch(url);
    if (!resp.ok) { hideResults(); return; }
    const data = await resp.json();
    if (!Array.isArray(data.results) || data.results.length === 0) { hideResults(); return; }
    renderResults(data.results);
  } catch {
    hideResults();
  }
}

function renderResults(results) {
  activeIndex = -1;
  resultsDiv.innerHTML = results.map((r, i) => `
    <div class="result-item" data-index="${i}" data-lat="${r.latitude}" data-lng="${r.longitude}">
      <div class="result-icon">${getIcon(r.subtype)}</div>
      <div class="result-text">
        <div class="result-name">${esc(r.name)}</div>
        <div class="result-detail">${esc(r.display_name)}</div>
      </div>
    </div>
  `).join("");

  resultsDiv.classList.add("visible");

  resultsDiv.querySelectorAll(".result-item").forEach(item => {
    item.addEventListener("mousedown", (e) => {
      e.preventDefault();
      const lat = parseFloat(item.dataset.lat);
      const lng = parseFloat(item.dataset.lng);
      selectResult(item.querySelector(".result-name").textContent, lat, lng);
    });
    item.addEventListener("mouseenter", () => {
      resultsDiv.querySelectorAll(".result-item").forEach(el => el.classList.remove("active"));
      item.classList.add("active");
    });
  });
}

function selectResult(name, lat, lng) {
  searchInput.value = name;
  hideResults();

  if (marker) marker.remove();
  const el = document.createElement("div");
  el.innerHTML = `<svg class="marker" viewBox="0 0 24 24" fill="#e74c3c" stroke="#fff" stroke-width="1.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="3" fill="#fff"/></svg>`;
  marker = new maplibregl.Marker({ element: el, anchor: "bottom" })
    .setLngLat([lng, lat])
    .addTo(map);

  map.flyTo({ center: [lng, lat], zoom: 12, duration: 1200 });
}

function hideResults() {
  resultsDiv.classList.remove("visible");
  resultsDiv.innerHTML = "";
  activeIndex = -1;
}

function esc(s) {
  const el = document.createElement("span");
  el.textContent = s;
  return el.innerHTML;
}

function getIcon(subtype) {
  const icons = { country: "C", dependency: "D", region: "R", county: "Co", locality: "L", localadmin: "LA" };
  return icons[subtype] || "?";
}
</script>
</body>
</html>
